[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saasbase-api"
version = "0.1.0"
description = "Saasbase generic FastAPI backend"
requires-python = ">=3.13"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in default arguments

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
