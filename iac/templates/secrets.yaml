AWSTemplateFormatVersion: '2010-09-09'
Description: Saasbase Secrets Manager - placeholder secret. Real values populated out-of-band.

Parameters:
  Stage:
    Type: String
  AppName:
    Type: String

Resources:
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}-app-secrets-${Stage}-v4'
      Description: >-
        Runtime secrets for Saasbase. Populated out-of-band with:
        signing_key, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
        STRIPE_CONNECT_CLIENT_ID, external API keys, Telegram bot token/chat id.
      SecretString: '{}'
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain

Outputs:
  SecretsArn:
    Value: !Ref AppSecrets
    Export:
      Name: !Sub '${AppName}-${Stage}-secrets-arn'
