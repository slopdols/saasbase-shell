AWSTemplateFormatVersion: '2010-09-09'
Description: Saasbase ECR - container image repository for the API Lambda.

Parameters:
  Stage:
    Type: String
  AppName:
    Type: String

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AppName}-api-${Stage}'
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub '${AppName}-${Stage}-ecr-repository-uri'
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: !Sub '${AppName}-${Stage}-ecr-repository-arn'
