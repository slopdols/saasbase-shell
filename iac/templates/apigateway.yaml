AWSTemplateFormatVersion: '2010-09-09'
Description: Saasbase API Gateway - HTTP API (v2) with $default route -> Lambda.

Parameters:
  Stage:
    Type: String
  AppName:
    Type: String

Resources:
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AppName}-api-${Stage}'
      ProtocolType: HTTP
      Description: Saasbase HTTP API (JWT verification happens in FastAPI, not at the gateway).

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::ImportValue:
          Fn::Sub: '${AppName}-${Stage}-lambda-function-arn'
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub 'integrations/${Integration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 100

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${AppName}-${Stage}-lambda-function-name'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/$default'

  # Custom domain mapping - enable after provisioning an ACM certificate
  # and a Route53 hosted zone (see apidomain.yaml). The DomainName must
  # exist in the account before this mapping can be created.
  # ApiMapping:
  #   Type: AWS::ApiGatewayV2::ApiMapping
  #   Properties:
  #     ApiId: !Ref Api
  #     DomainName: api.saasbase.example.com
  #     Stage: $default

Outputs:
  ApiEndpoint:
    Value: !GetAtt Api.ApiEndpoint
    Export:
      Name: !Sub '${AppName}-${Stage}-api-endpoint'
  ApiId:
    Value: !Ref Api
    Export:
      Name: !Sub '${AppName}-${Stage}-api-id'
